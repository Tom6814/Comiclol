<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tsukimi · 月見</title>
<style>
  /* === Morandi 调色板 === */
  :root {
    --bg:        #e8e3d9;
    --bg-soft:   #eeeae2;
    --surface:   #f4f1ea;
    --surface-2: #dfd8cb;
    --ink:       #463f3a;
    --ink-2:     #766c65;
    --ink-3:     #a0968e;
    --line:      #cec5b8;
    --line-soft: #dfd6ca;
    --accent:    #b37b67;
    --accent-2:  #ce9987;
    --sage:      #86907b;
    --warn:      #be7e56;
    --radius:    4px;
    --radius-lg: 8px;
    --shadow:    0 2px 8px rgba(70, 63, 58, 0.05), 0 8px 24px rgba(70, 63, 58, 0.05);
    --serif:     "Cormorant Garamond", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", Georgia, serif;
    --sans:      -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono:      "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  body.reader-open { overflow: hidden; }
  a { color: var(--accent); text-decoration: none; transition: color 0.2s ease; }
  a:hover { color: var(--ink); }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }

  /* === 加载动画 === */
  .spinner {
    display: inline-block; width: 28px; height: 28px;
    border: 3px solid var(--line-soft); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 12px; color: var(--ink-3); }

  /* === 顶栏 === */
  header.topbar {
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 28px;
    position: sticky; top: 0; z-index: 30;
    transition: background-color 0.3s ease;
  }
  .brand { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: 1px; color: var(--ink); }
  .brand small { font-family: var(--sans); font-size: 11px; color: var(--ink-3); margin-left: 6px; letter-spacing: 2px; }
  nav.main { display: flex; gap: 4px; flex: 1; }
  nav.main a {
    padding: 7px 14px; border-radius: var(--radius); color: var(--ink-2); font-size: 14px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  nav.main a:hover { background: var(--surface-2); color: var(--ink); }
  nav.main a.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .topbar .right { display: flex; align-items: center; gap: 14px; }
  .session-pill { font-size: 12px; color: var(--ink-2); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--line); transition: all 0.2s ease; }
  .session-pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; }
  .session-pill.online .dot { background: var(--sage); }

  /* === 主体 === */
  main { max-width: 1240px; margin: 0 auto; padding: 28px; min-height: calc(100vh - 60px); }
  .view { display: none; opacity: 0; transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .view.active { display: block; opacity: 1; animation: fadeSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .view-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
  .view-header h1 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 0; letter-spacing: 0.5px; }
  .view-header .hint { color: var(--ink-3); font-size: 13px; }
  .view-header .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lib-search {
    padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); min-width: 200px; outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .lib-search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(164, 116, 99, 0.18); }
  .lib-search::placeholder { color: var(--ink-3); }

  /* === 按钮 === */
  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 8px 16px; border-radius: var(--radius); font-size: 14px;
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-3); transform: translateY(-1px); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .btn:active { transform: translateY(0); box-shadow: none; }
  .btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  .btn.primary:hover { background: #9e6955; border-color: #9e6955; }
  .btn.subtle { background: transparent; border-color: transparent; color: var(--ink-2); padding: 6px 10px; }
  .btn.subtle:hover { color: var(--ink); background: var(--surface-2); transform: none; box-shadow: none; }
  .btn.danger { color: var(--accent); }
  .btn.danger:hover { background: rgba(179,123,103,0.1); border-color: var(--accent); }

  /* === 输入 === */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--ink-2); letter-spacing: 0.5px; }
  .field input, .field select, .field textarea {
    background: var(--surface); border: 1px solid var(--line); padding: 9px 12px; border-radius: var(--radius); color: var(--ink);
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent-2); background: var(--bg-soft); }

  /* === 卡片网格 === */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px;
  }
  .manga-card {
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 10px; cursor: pointer; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .manga-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--line); }
  .cover {
    aspect-ratio: 3/4; border-radius: var(--radius); background: var(--surface-2);
    background-size: cover; background-position: center; position: relative; overflow: hidden;
  }
  .cover.empty { display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 12px; }
  .cover-wrap { aspect-ratio: 3/4; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); position: relative; }
  .cover-wrap .cover-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.3s ease; }
  .cover-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-3); font-family: var(--serif); font-size: 36px;
    background: linear-gradient(135deg, var(--surface-2), var(--bg-soft));
  }
  .cover-fallback > span { opacity: 0.55; }
  .cover .badge {
    position: absolute; top: 6px; right: 6px;
    background: var(--sage); color: var(--surface); font-size: 10px;
    padding: 3px 7px; border-radius: var(--radius); letter-spacing: 0.5px;
  }
  .manga-card .title { font-size: 14px; color: var(--ink); font-weight: 500; line-height: 1.35; max-height: 2.7em; overflow: hidden; }
  .manga-card .meta { font-size: 12px; color: var(--ink-3); }

  /* === 详情 === */
  .detail { display: grid; grid-template-columns: 260px 1fr; gap: 32px; }
  .detail .cover-big {
    aspect-ratio: 3/4; border-radius: var(--radius-lg); background: var(--surface-2);
    background-size: cover; background-position: center; box-shadow: var(--shadow);
  }
  .detail h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin: 0 0 6px; letter-spacing: 0.3px; }
  .detail .author { color: var(--accent); margin-bottom: 14px; }
  .detail .info-row { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0; color: var(--ink-2); font-size: 13px; }
  .detail .info-row span { background: var(--surface); padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--line-soft); }
  .detail .desc { color: var(--ink-2); font-size: 14px; line-height: 1.7; margin: 14px 0; }
  .detail .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  .tag { background: var(--surface-2); color: var(--ink-2); padding: 3px 9px; border-radius: var(--radius); font-size: 12px; transition: background-color 0.2s ease; }
  .tag:hover { background: var(--line-soft); }
  .progress-hint {
    display: inline-block; margin: 4px 0 10px; padding: 6px 12px; font-size: 13px;
    color: var(--accent); background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 2px;
  }
  .chapter-list { margin-top: 18px; border-top: 1px solid var(--line-soft); }
  .chapter-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px; border-bottom: 1px solid var(--line-soft);
    transition: background-color 0.2s ease;
  }
  .chapter-item:hover { background: rgba(255,255,255,0.3); }
  .chapter-item .name { color: var(--ink); font-size: 14px; }
  .chapter-item .pages { color: var(--ink-3); font-size: 12px; margin-left: 8px; }
  .chapter-item .ctrls { display: flex; gap: 6px; }
  .chapter-item .status { font-size: 11px; color: var(--sage); margin-right: 8px; }
  .chapter-item .status.missing { color: var(--ink-3); }

  /* === Reader === */
  #view-reader { 
    position: fixed; inset: 0; z-index: 1000; background: var(--bg); 
    overflow-y: auto; overflow-x: hidden; display: none; flex-direction: column; 
  }
  #view-reader.active { display: flex; animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .reader-toolbar {
    position: fixed; z-index: 1010; left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--line);
    padding: 10px 28px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    box-shadow: var(--shadow);
  }
  .reader-toolbar.top { top: 0; border-top: none; border-left: none; border-right: none; }
  .reader-toolbar.bottom { bottom: 0; border-bottom: none; border-left: none; border-right: none; }
  .reader-toolbar .chap-name { font-family: var(--serif); font-size: 17px; text-align: center; flex: 1; }
  
  #view-reader.ui-hidden .reader-toolbar.top { transform: translateY(-100%); opacity: 0; }
  #view-reader.ui-hidden .reader-toolbar.bottom { transform: translateY(100%); opacity: 0; }
  
  .reader-pages { display: flex; flex-direction: column; align-items: center; padding: 0; gap: 0; flex: 1; cursor: pointer; }
  .reader-pages img { max-width: 920px; width: 100%; display: block; background: var(--bg); transition: opacity 0.3s ease; }
  .reader-pages img[data-src] { opacity: 0; }

  /* === 下载 === */
  .task-card {
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 14px 16px; margin-bottom: 12px; transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .task-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .task-card .title { font-weight: 500; }
  .task-card .status { font-size: 12px; padding: 3px 9px; border-radius: var(--radius); }
  .task-card .status.queued { background: var(--surface-2); color: var(--ink-2); }
  .task-card .status.running { background: rgba(179,123,103,0.12); color: var(--accent); }
  .task-card .status.done    { background: rgba(134,144,123,0.18); color: var(--sage); }
  .task-card .status.failed  { background: rgba(190,126,86,0.18); color: var(--warn); }
  .task-card .status.canceled{ background: var(--surface-2); color: var(--ink-3); }
  .progress {
    height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden;
  }
  .progress > span { display: block; height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .task-card .meta { display: flex; gap: 16px; margin-top: 8px; color: var(--ink-3); font-size: 12px; }

  /* === Modal === */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(70, 63, 58, 0.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    transition: opacity 0.2s ease;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg); padding: 24px 28px;
    width: min(420px, 92vw); box-shadow: var(--shadow); border: 1px solid var(--line);
    animation: modalScaleIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes modalScaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .modal h2 { margin: 0 0 16px; font-family: var(--serif); font-weight: 500; font-size: 22px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  /* === Settings === */
  .settings-section {
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 22px 26px; margin-bottom: 18px; transition: box-shadow 0.2s ease;
  }
  .settings-section:hover { box-shadow: var(--shadow); }
  .settings-section h3 { margin: 0 0 14px; font-family: var(--serif); font-weight: 500; font-size: 19px; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }

  /* === Empty === */
  .empty { text-align: center; padding: 80px 20px; color: var(--ink-3); animation: fadeIn 0.3s ease; }
  .empty .glyph { font-family: var(--serif); font-size: 60px; color: var(--line); margin-bottom: 12px; }
  .empty .msg { font-size: 15px; }

  /* === Toast === */
  #toasts { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: var(--radius);
    box-shadow: var(--shadow); font-size: 13px; animation: toast-in 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toast.err { background: var(--warn); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* === Pagination === */
  .pagination { display: flex; justify-content: center; gap: 8px; margin: 24px 0; }
  .pagination button { min-width: 36px; padding: 6px 10px; }

  @media (max-width: 760px) {
    header.topbar { padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
    nav.main { order: 3; width: 100%; overflow-x: auto; }
    main { padding: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .detail { grid-template-columns: 1fr; }
    .detail .cover-big { max-width: 240px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">月見<small>TSUKIMI</small></div>
  <nav class="main">
    <a href="#/"        data-nav="library">书库</a>
    <a href="#/favorites" data-nav="favorites">收藏</a>
    <a href="#/downloads" data-nav="downloads">下载</a>
    <a href="#/settings"  data-nav="settings">设置</a>
  </nav>
  <div class="right">
    <span id="sessionPill" class="session-pill"><span class="dot"></span>未登录</span>
  </div>
</header>

<main>
  <!-- 书库 -->
  <section id="view-library" class="view">
    <div class="view-header">
      <h1>书库</h1>
      <div class="actions">
        <input type="search" id="libSearch" class="lib-search" placeholder="搜索书名 / 作者…" autocomplete="off">
        <button class="btn" id="btnSyncNow">立即同步收藏</button>
        <button class="btn primary" id="btnAddById">按 ID 下载</button>
      </div>
    </div>
    <div id="libraryGrid" class="grid"></div>
  </section>

  <!-- 详情 -->
  <section id="view-detail" class="view">
    <div class="view-header">
      <h1><a href="#/">‹ 书库</a></h1>
    </div>
    <div id="detailBody"></div>
  </section>

  <!-- 收藏 -->
  <section id="view-favorites" class="view">
    <div class="view-header">
      <h1>收藏</h1>
      <div class="hint" id="favHint"></div>
    </div>
    <div id="favoritesBody"></div>
  </section>

  <!-- 下载 -->
  <section id="view-downloads" class="view">
    <div class="view-header">
      <h1>下载</h1>
      <button class="btn subtle" id="btnRefreshTasks">刷新</button>
    </div>
    <div id="downloadsList"></div>
  </section>

  <!-- 设置 -->
  <section id="view-settings" class="view">
    <div class="view-header">
      <h1>设置</h1>
    </div>
    <div id="settingsBody"></div>
  </section>

<!-- Reader 是独立全屏视图 -->
<section id="view-reader" class="view ui-hidden">
  <div class="reader-toolbar top" id="readerToolbarTop">
    <button class="btn subtle" id="readerClose">‹ 返回</button>
    <div class="chap-name" id="readerChapName"></div>
    <button class="btn subtle" id="readerFullscreenBtn">全屏</button>
  </div>
  <div class="reader-pages" id="readerPages"></div>
  <div class="reader-toolbar bottom" id="readerToolbarBottom">
    <button class="btn subtle" id="readerPrevChap">上一章</button>
    <button class="btn subtle" id="readerNextChap">下一章</button>
  </div>
</section>
</main>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
// ============================================================
//  tsukimi 前端：单文件 vanilla JS。
//  路由用 location.hash，状态用闭包，渲染直接 innerHTML。
//  个人项目不需要框架，能少 200KB 就少 200KB。
// ============================================================

const api = {
  get:    (p)    => fetch(p).then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status))),
  post:   (p, b) => fetch(p, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(b||{})}).then(handleJSON),
  put:    (p, b) => fetch(p, {method:"PUT",  headers:{"Content-Type":"application/json"}, body: JSON.stringify(b||{})}).then(handleJSON),
  del:    (p)    => fetch(p, {method:"DELETE"}).then(handleJSON),
};
function handleJSON(r) {
  if (!r.ok) return r.json().then(j => Promise.reject(new Error(j.error || ("HTTP "+r.status)))).catch(() => Promise.reject(new Error("HTTP "+r.status)));
  return r.json();
}
function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function renderLoading(rootId) {
  document.getElementById(rootId).innerHTML = `
    <div class="loading-wrap" style="grid-column: 1 / -1;">
      <div class="spinner"></div>
      <div>加载中...</div>
    </div>
  `;
}

const state = {
  library: [],
  libraryQuery: "",
  current: null,        // 当前详情 manga
  favoritesPage: 1,
  favorites: null,
  tasks: [],
  session: [],
  cfg: null,
  reader: { src:"", id:"", ch:"", pages: [], chapName:"", chapters: [], totalPages: 0, saveTimer: null, lastSavedPage: 0 },
};

// ===== Routing =====
function route() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);  // e.g. ["manga", "jmcomic", "123"]
  hideAllViews();
  document.querySelectorAll("nav.main a").forEach(a => a.classList.remove("active"));

  if (parts.length === 0)               { showView("library");   markNav("library");   loadLibrary(); }
  else if (parts[0] === "manga")        { showView("detail");                            loadDetail(parts[1], parts[2]); }
  else if (parts[0] === "read")         { showView("reader");                            loadReader(parts[1], parts[2], parts[3]); }
  else if (parts[0] === "favorites")    { showView("favorites");  markNav("favorites"); loadFavorites(); }
  else if (parts[0] === "downloads")    { showView("downloads");  markNav("downloads"); loadTasks(); }
  else if (parts[0] === "settings")     { showView("settings");   markNav("settings");  loadSettings(); }
  else                                  { showView("library");   markNav("library");   loadLibrary(); }
}
function showView(id) { 
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  const target = document.getElementById("view-"+id);
  target.classList.add("active");
  document.body.style.background = id === "reader" ? "var(--bg-soft)" : "var(--bg)";
  if (id === "reader") {
    document.body.classList.add("reader-open");
    target.classList.remove("ui-hidden");
  } else {
    document.body.classList.remove("reader-open");
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(e => {});
    }
  }
}
function hideAllViews(){ document.querySelectorAll(".view").forEach(v => v.classList.remove("active")); }
function markNav(name) { const a = document.querySelector('nav.main a[data-nav="'+name+'"]'); if (a) a.classList.add("active"); }
window.addEventListener("hashchange", route);

// ===== Session pill =====
async function refreshSession() {
  try {
    const list = await api.get("/api/session");
    state.session = list;
    const pill = document.getElementById("sessionPill");

function fmtTime(s) {

  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function startReading() {
  const m = state.current;
  const chaps = m.chapters || [];
  let target = null;
  if (m.progress && m.progress.chapter_id) {
    target = chaps.find(c => c.id == m.progress.chapter_id) || null;
  }
  if (!target) {
    for (const c of chaps) {
      const ok = await fetch(`/api/library/${m.source_id}/${m.id}/${c.id}/pages`)
        .then(r => r.ok ? r.json() : null).then(j => j && j.count > 0).catch(() => false);
      if (ok) { target = c; break; }
    }
  }
  if (!target) { toast("没有可阅读的已下载章节", true); return; }
  location.hash = `#/read/${m.source_id}/${m.id}/${target.id}`;
}

async function loadReader(src, id, ch) {
  state.reader = { src, id, ch, pages: [], chapName: "", chapters: [], totalPages: 0, saveTimer: null, lastSavedPage: 0 };
  document.getElementById("readerChapName").textContent = "加载中…";
  renderLoading("readerPages");
  try {
    const m = state.current || await api.get(`/api/library/${src}/${id}`);
    if (!state.current) state.current = m;
    state.reader.chapters = m.chapters || [];
    const r = await api.get(`/api/library/${src}/${id}/${ch}/pages`);
    state.reader.pages = r.pages || [];
    state.reader.totalPages = r.count || state.reader.pages.length;
    const chap = (m.chapters||[]).find(c => c.id == ch);
    state.reader.chapName = chap?.title || ("第 "+chap?.index+" 章") || ch;
    document.getElementById("readerChapName").textContent = state.reader.chapName;
    // 先查阅读进度，再渲染：恢复时直接从目标页附近开始加载
    let resumePage = 0;
    try {
      const prog = await api.get(`/api/history/${src}/${id}`);
      if (prog && String(prog.chapter_id) === String(ch) && prog.page > 1) {
        resumePage = prog.page;
      }
    } catch (e) {}
    renderReaderPages(resumePage);
  } catch (e) {
    document.getElementById("readerPages").innerHTML = `<div class="empty"><div class="glyph">月</div><div class="msg">章节尚未下载：${e.message}<br><button class="btn" onclick="downloadChapter('${ch}')">下载本章</button></div></div>`;
  }
}
function renderReaderPages(resumePage) {
  const root = document.getElementById("readerPages");
  if (state.reader.pages.length === 0) {
    root.innerHTML = `<div class="empty"><div class="glyph">月</div><div class="msg">空章节</div></div>`;
    return;
  }
  // 继续阅读：只立即加载目标页及其下方窗口，上方最多预载 1 张。
  // 上方图片加载会撑开内容、把目标页推走（页面自己移动），所以上方不预载。
  // 下方图片撑开只增加总高度，不影响视口内内容。
  const W = 4; // 目标页下方窗口半径
  const win = new Set();
  if (resumePage && resumePage >= 1) {
    for (let i = resumePage; i <= Math.min(state.reader.pages.length, resumePage + W); i++) win.add(i);
    if (resumePage > 1) win.add(resumePage - 1); // 上方最多 1 张，便于向上回看
  }
  root.innerHTML = state.reader.pages.map((p, i) => {
    const idx = i + 1;
    return win.has(idx)
      ? `<img src="${p}" data-idx="${i}" alt="page ${idx}" style="min-height: 200px;">`
      : `<img data-src="${p}" data-idx="${i}" alt="page ${idx}" style="min-height: 200px;">`;
  }).join("");
  lazyImages();
  if (resumePage) scrollToPage(resumePage);
}
function scrollToPage(page) {
  const container = document.getElementById("view-reader");
  const imgs = document.querySelectorAll("#readerPages img");
  const img = imgs[page - 1];
  if (!img) return;
  const ANCHOR = 70; // 目标页顶部与视口顶部的固定距离（顶部工具栏高度）
  let anchorPos = ANCHOR;
  const position = () => {
    // 手动定位到滚动容器（offsetTop 相对 #view-reader），补偿顶部固定工具栏
    container.scrollTop = Math.max(0, img.offsetTop - ANCHOR);
    anchorPos = img.offsetTop - container.scrollTop;
  };
  requestAnimationFrame(position);
  // 锚定补偿：图片加载撑开上方内容时，按增量调整 scrollTop，
  // 保证目标页在视口中的位置不变（页面不会自己移动）。
  const stabilize = () => {
    const now = img.offsetTop - container.scrollTop;
    const delta = now - anchorPos;
    if (Math.abs(delta) > 1) {
      container.scrollTop += delta;
      anchorPos = img.offsetTop - container.scrollTop;
    }
  };
  const pending = [...document.querySelectorAll("#readerPages img[src]")].filter(im => !im.complete);
  pending.forEach(im => {
    im.addEventListener("load", stabilize, { once: true });
    im.addEventListener("error", stabilize, { once: true });
  });
  setTimeout(position, 800); // 兜底
}
// 当前阅读页：视口上 1/3 处对应的图片序号（1-based）
function currentPage() {
  const container = document.getElementById("view-reader");
  const imgs = document.querySelectorAll("#readerPages img");
  if (!imgs.length) return 0;
  const mid = container.scrollTop + container.clientHeight * 0.35;
  for (let i = 0; i < imgs.length; i++) {
    const el = imgs[i];
    if (el.offsetTop + el.offsetHeight >= mid) return i + 1;
  }
  return imgs.length;
}
// 节流保存进度：滚动时收集，800ms 防抖合并为一次 PUT
function saveProgress(page) {
  state.reader.lastSavedPage = page;
  clearTimeout(state.reader.saveTimer);
  state.reader.saveTimer = setTimeout(() => {
    api.put(`/api/history/${state.reader.src}/${state.reader.id}`, {
      chapter_id: state.reader.ch,
      page,
      total_pages: state.reader.totalPages,
    }).catch(() => {});
  }, 800);
}
function saveProgressNow() {
  const page = currentPage();
  if (page > 0) saveProgress(page);
}
function lazyImages() {
  const imgs = document.querySelectorAll("#readerPages img[data-src]");
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const img = e.target;
        img.src = img.dataset.src;
        img.removeAttribute("data-src");
        io.unobserve(img);
      }
    });
  }, { rootMargin: "300px" });
  imgs.forEach(img => io.observe(img));
}
document.getElementById("readerClose").onclick  = () => { saveProgressNow(); history.back(); };
document.getElementById("readerPrevChap").onclick = () => navigateChapter(-1);
document.getElementById("readerNextChap").onclick = () => navigateChapter(1);

};
document.getElementById("readerFullscreenBtn").onclick = () => {
  const r = document.getElementById("view-reader");
  if (!document.fullscreenElement) {
    r.requestFullscreen().catch(err => toast("全屏失败", true));
  } else {
    document.exitFullscreen().catch(()=>{});
  }
};
// 滚动时记录阅读进度（rAF 节流，避免每帧计算）
let readerScrollRAF = null;
document.getElementById("view-reader").addEventListener("scroll", () => {
  if (readerScrollRAF) return;
  readerScrollRAF = requestAnimationFrame(() => {
    readerScrollRAF = null;
    const page = currentPage();
    if (page > 0 && page !== state.reader.lastSavedPage) saveProgress(page);
  });
}, { passive: true });

function navigateChapter(delta) {
  const chaps = state.reader.chapters;
  if (!chaps || chaps.length === 0) return;
  const idx = chaps.findIndex(c => c.id == state.reader.ch);
  if (idx < 0) return;
  const next = chaps[idx + delta];
  if (!next) { toast(delta > 0 ? "已是最后一章" : "已是第一章"); return; }
  // 切换前立即保存当前位置
  saveProgressNow();
  location.hash = `#/read/${state.reader.src}/${state.reader.id}/${next.id}`;
}
async function readChapter(ch) {
  // 先检查是否已下载
  try {
    const r = await fetch(`/api/library/${state.current.source_id}/${state.current.id}/${ch}/pages`);
    if (r.ok) {
      const j = await r.json();
      if (j.count > 0) { location.hash = `#/read/${state.current.source_id}/${state.current.id}/${ch}`; return; }
    }
  } catch (e) {}
  if (confirm("章节尚未下载，是否现在下载？")) { await downloadChapter(ch); }
}

  if (!u || !p) { toast("请输入用户名和密码", true); return; }
  try {
    await api.put("/api/config", { jm: { username: u, password: p } });
    const r = await api.post("/api/login", { source: "jmcomic", username: u, password: p });
    toast("登录成功：" + r.username);
    refreshSession();
  } catch (e) { toast("登录失败: " + e.message, true); }
}
async function saveSettings() {
  const patch = {
    chapter_jobs:  +document.getElementById("cfgChapterJobs").value,
    image_quality: +document.getElementById("cfgImageQuality").value,
    sync_enabled:  document.getElementById("cfgSyncEnabled").value === "true",
    sync_interval: +document.getElementById("cfgSyncInterval").value,
  };
  try {
    await api.put("/api/config", patch);
    toast("已保存");
  } catch (e) { toast(e.message, true); }
}

}

      <div class="modal">
        <h2>按 ID 下载</h2>

async function modalAdd() {

    await api.post("/api/downloads", { source:"jmcomic", manga_id:id, title:"" });

document.getElementById("btnAddById").onclick  = openAddByIdModal;
document.getElementById("libSearch").addEventListener("input", e => {
  state.libraryQuery = e.target.value.trim().toLowerCase();
  renderLibrary();
});
document.getElementById("btnSyncNow").onclick  = async () => {
  try { await api.post("/api/favorites/sync"); toast("已触发同步"); }
  catch(e){ toast("同步失败: " + e.message, true); }
};
document.getElementById("btnRefreshTasks").onclick = loadTasks;

// ===== SSE: live updates =====
function openSSE() {
  const es = new EventSource("/api/events");
  es.addEventListener("download.progress", e => {
    try {
      const p = JSON.parse(e.data);
      const t = state.tasks.find(x => x.id === p.payload.task_id);
      if (t) { t.progress = p.payload.progress || t.progress; t.done = p.payload.done || t.done; t.total = p.payload.total || t.total; t.status = "running"; renderTasks(); }
    } catch(_) {}
  });
  es.addEventListener("download.complete", e => { setTimeout(loadTasks, 300); });
  es.addEventListener("download.failed",   e => { setTimeout(loadTasks, 300); });
  es.addEventListener("download.queued",   e => { setTimeout(loadTasks, 300); });
  es.addEventListener("sync.new.manga",    e => { toast("同步发现新收藏"); });
}

// ===== utils =====
function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ===== boot =====
refreshSession();
openSSE();
route();
// 周期性刷新会话状态
setInterval(refreshSession, 30000);
</script>
